<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=frontend/login.html" />
  <title>MOVAni — Sign In</title>
  <script>
    try {
      const token = localStorage.getItem('movani_token');
      const user = localStorage.getItem('movani_user');
      if (token && user) {
        window.location.replace("frontend/index.html");
      } else {
        window.location.replace("frontend/login.html");
      }
    } catch {
      window.location.replace("frontend/login.html");
    }
  </script>
</head>
<body style="margin:0; background-color:#0b0c10; color:#ffffff; font-family:system-ui,-apple-system,sans-serif; display:flex; align-items:center; justify-content:center; height:100vh;">
  <div style="text-align:center;">
    <h1 style="font-size:28px; font-weight:800; margin-bottom:12px; letter-spacing:-0.5px;">MOV<span style="color:#e50914;">Ani</span></h1>
    <p style="color:#838b9e; font-size:14px; margin-bottom:20px;">Connecting to authentication gateway...</p>
    <a href="frontend/login.html" style="display:inline-block; padding:12px 24px; background:#e50914; color:#fff; text-decoration:none; border-radius:10px; font-size:14px; font-weight:700;">Sign In to MOVAni</a>
  </div>
</body>
</html>
